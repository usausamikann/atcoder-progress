name: Sync AtCoder submissions

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync.yml"
  schedule:
    # JST 03:17, 09:17, 15:17, 21:17 (best effort; GitHub may delay runs).
    - cron: "17 0,6,12,18 * * *"
    # Weekly refresh for problem names, indices and estimated difficulties.
    - cron: "47 2 * * 0"
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: "Also refresh problem metadata (names, indices and difficulties)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atcoder-progress-sync-main
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run offline tests before touching stored data
        run: python -m unittest discover -s tests -v
      - name: Fetch and build snapshots
        env:
          REFRESH_CATALOG: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh_catalog) || github.event.schedule == '47 2 * * 0' }}
        run: |
          if [ "$REFRESH_CATALOG" = "true" ]; then
            python scripts/sync.py --refresh-catalog
          else
            python scripts/sync.py
          fi
      - name: Commit changes only when data differs
        run: |
          git add -- data/
          if git diff --cached --quiet; then
            echo "No new submissions or metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh AtCoder submissions"
          git push origin HEAD:main
